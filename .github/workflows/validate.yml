name: Validate Terraform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive .
      - run: terraform -chdir=aws init -backend=false -input=false
      - run: terraform -chdir=aws validate
      - run: terraform -chdir=aws test
      - run: terraform -chdir=bootstrap init -backend=false -input=false
      - run: terraform -chdir=bootstrap validate
